# Database connection details from environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Puerto de la aplicación Spring Boot
server.port=${PORT:8080}

# 'create' dropea y recrea el esquema al inicio. Usar para corregir la estructura de la tabla.
spring.jpa.hibernate.ddl-auto=create
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Especificar el dialecto de la base de datos
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Desabilitar la advertencia de open-in-view
spring.jpa.open-in-view=false